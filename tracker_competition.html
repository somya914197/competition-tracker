<h2 class="sr-only">Competition Tracker — บันทึกรายการแข่งขัน เรียงตาม deadline อัตโนมัติ</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.app-title{font-size:18px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}
.app-sub{font-size:13px;color:var(--color-text-secondary);margin-top:3px}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.7rem 1rem}
.stat-lbl{font-size:12px;color:var(--color-text-secondary);margin-bottom:3px}
.stat-num{font-size:22px;font-weight:500}
.tbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.tbar input,.tbar select{font-size:13px}
.tbar input{flex:1;min-width:140px}
.cards{display:flex;flex-direction:column;gap:10px}
.ccard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;border-left-width:3px;border-left-style:solid}
.ccard.urg{border-left-color:#E24B4A}
.ccard.soon{border-left-color:#EF9F27}
.ccard.ok{border-left-color:#639922}
.ccard.done{border-left-color:#888780;opacity:.72}
.crow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:.5rem;flex-wrap:wrap}
.ctitle{font-size:15px;font-weight:500;color:var(--color-text-primary);flex:1}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill-urg{background:#FCEBEB;color:#791F1F}
.pill-soon{background:#FAEEDA;color:#633806}
.pill-ok{background:#EAF3DE;color:#27500A}
.pill-done{background:#F1EFE8;color:#444441}
.pill-gold{background:#FAEEDA;color:#633806}
.pill-silver{background:#F1EFE8;color:#444441}
.pill-bronze{background:#FAECE7;color:#712B13}
.pill-part{background:#EAF3DE;color:#27500A}
.pill-fail{background:#FCEBEB;color:#791F1F}
.cmeta{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px;color:var(--color-text-secondary);margin-bottom:.5rem}
.cmeta span{display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta b{color:var(--color-text-primary);font-weight:500}
.cnote{font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:5px 9px;margin-bottom:.5rem}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
.pbar{flex:1;height:4px;background:var(--color-border-tertiary);border-radius:999px;overflow:hidden}
.pfill{height:100%;border-radius:999px;transition:width .3s}
.pfill-urg{background:#E24B4A}
.pfill-soon{background:#EF9F27}
.pfill-ok{background:#639922}
.pfill-done{background:#888780}
.pct{font-size:11px;color:var(--color-text-secondary);min-width:28px;text-align:right}
.cbtns{display:flex;gap:6px;padding-top:.65rem;border-top:0.5px solid var(--color-border-tertiary)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--color-text-secondary);background:var(--color-background-secondary);border-radius:var(--border-radius-lg)}
.empty i{font-size:36px;display:block;margin-bottom:.6rem;opacity:.4}
.ov{background:rgba(0,0,0,.45);padding:1.5rem 1rem;border-radius:var(--border-radius-lg);margin-top:1.25rem;display:none}
.ov.open{display:block}
.modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:1.5rem;max-width:500px;margin:0 auto}
.mh{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.field{margin-bottom:.85rem}
.field label{display:block;font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;font-size:13px}
.field textarea{height:60px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;padding-top:1rem;border-top:0.5px solid var(--color-border-tertiary)}
.req{color:var(--color-text-danger)}
</style>

<div class="wrap">
  <div class="toprow">
    <div>
      <div class="app-title"><i class="ti ti-trophy" aria-hidden="true"></i>Competition tracker</div>
      <div class="app-sub">เรียง deadline อัตโนมัติ · บันทึกผลและความคืบหน้า</div>
    </div>
    <button onclick="openAdd()" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 14px"><i class="ti ti-plus" aria-hidden="true"></i>เพิ่มรายการ</button>
  </div>

  <div class="statrow" id="stats"></div>

  <div class="tbar">
    <input type="text" id="sq" placeholder="ค้นหา ชื่อรายการ / ผู้เข้าร่วม / ครู..." oninput="render()">
    <select id="fs" onchange="render()">
      <option value="">สถานะทั้งหมด</option>
      <option value="active">กำลังจะถึง</option>
      <option value="done">สิ้นสุดแล้ว</option>
    </select>
    <select id="fr" onchange="render()">
      <option value="">ผลทั้งหมด</option>
      <option value="gold">ชนะเลิศ</option>
      <option value="silver">รองชนะเลิศ</option>
      <option value="bronze">รางวัลที่ 3</option>
      <option value="participated">เข้าร่วม</option>
      <option value="not_qualified">ไม่ผ่าน</option>
    </select>
    <button onclick="doExport()" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 12px"><i class="ti ti-download" aria-hidden="true"></i>CSV</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="ov" id="ov">
    <div class="modal">
      <div class="mh" id="mh"><i class="ti ti-tournament" aria-hidden="true"></i>เพิ่มรายการแข่งขัน</div>
      <div class="field"><label>ชื่อรายการแข่งขัน <span class="req">*</span></label><input type="text" id="fn" placeholder="เช่น การแข่งขันหุ่นยนต์แห่งชาติ 2568"></div>
      <div class="frow">
        <div class="field"><label>วันที่ deadline / วันแข่ง <span class="req">*</span></label><input type="date" id="fd"></div>
        <div class="field"><label>ระดับ</label>
          <select id="flv">
            <option>ระดับโรงเรียน</option><option>ระดับเขต</option><option>ระดับจังหวัด</option><option>ระดับภาค</option><option>ระดับชาติ</option><option>นานาชาติ</option>
          </select>
        </div>
      </div>
      <div class="field"><label>ผู้เข้าร่วม (คั่นด้วยจุลภาค)</label><input type="text" id="fm" placeholder="เช่น สมชาย ใจดี, สมหญิง รักเรียน"></div>
      <div class="field"><label>ครูที่ปรึกษา</label><input type="text" id="ft" placeholder="เช่น ครูวิไล มีสุข"></div>
      <div class="frow">
        <div class="field"><label>ผลการแข่งขัน</label>
          <select id="frs">
            <option value="">— ยังไม่ทราบผล —</option>
            <option value="gold">ชนะเลิศ / อันดับ 1</option>
            <option value="silver">รองชนะเลิศ / อันดับ 2</option>
            <option value="bronze">รางวัลที่ 3</option>
            <option value="participated">เข้าร่วม</option>
            <option value="not_qualified">ไม่ผ่านเกณฑ์</option>
          </select>
        </div>
        <div class="field"><label>ความคืบหน้า (0–100%)</label><input type="number" id="fp" min="0" max="100" value="0"></div>
      </div>
      <div class="field"><label>หมายเหตุ / สถานะ</label><textarea id="fno" placeholder="บันทึกรายละเอียด ความคืบหน้า..."></textarea></div>
      <div class="mfoot">
        <button onclick="closeModal()" style="font-size:13px;padding:7px 14px"><i class="ti ti-x" aria-hidden="true"></i> ยกเลิก</button>
        <button onclick="save()" style="font-size:13px;font-weight:500;padding:7px 14px"><i class="ti ti-check" aria-hidden="true"></i> บันทึก</button>
      </div>
    </div>
  </div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('ct_v4')||'[]');
let eid=null;

function persist(){try{localStorage.setItem('ct_v4',JSON.stringify(db));}catch(e){}}

function days(s){const d=new Date(s),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000);}

function urg(e){
  if(e.result)return'done';
  const d=days(e.date);
  if(d<0)return'done';
  if(d<=7)return'urg';
  if(d<=30)return'soon';
  return'ok';
}

function urgLabel(u,d){
  if(u==='done')return'สิ้นสุดแล้ว';
  if(d===0)return'วันนี้!';
  if(d===1)return'พรุ่งนี้';
  if(d<0)return Math.abs(d)+' วันที่แล้ว';
  return d+' วันที่เหลือ';
}

const RL={gold:'ชนะเลิศ',silver:'รองชนะเลิศ',bronze:'รางวัลที่ 3',participated:'เข้าร่วม',not_qualified:'ไม่ผ่าน'};
const RC={gold:'pill-gold',silver:'pill-silver',bronze:'pill-bronze',participated:'pill-part',not_qualified:'pill-fail'};
const UC={urg:'pill-urg',soon:'pill-soon',ok:'pill-ok',done:'pill-done'};

function fmt(s){if(!s)return'—';return new Date(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}

function render(){
  const q=(document.getElementById('sq').value||'').toLowerCase();
  const fs=document.getElementById('fs').value;
  const fr=document.getElementById('fr').value;
  let items=[...db].sort((a,b)=>{
    const o={urg:0,soon:1,ok:2,done:3};
    const ua=urg(a),ub=urg(b);
    if(o[ua]!==o[ub])return o[ua]-o[ub];
    return new Date(a.date)-new Date(b.date);
  });
  if(q)items=items.filter(x=>x.name.toLowerCase().includes(q)||(x.members||'').toLowerCase().includes(q)||(x.teacher||'').toLowerCase().includes(q));
  if(fs==='active')items=items.filter(x=>urg(x)!=='done');
  if(fs==='done')items=items.filter(x=>urg(x)==='done');
  if(fr)items=items.filter(x=>x.result===fr);

  const tot=db.length,act=db.filter(x=>urg(x)!=='done').length,hot=db.filter(x=>urg(x)==='urg').length,won=db.filter(x=>['gold','silver','bronze'].includes(x.result)).length;
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="stat-lbl">รายการทั้งหมด</div><div class="stat-num" style="color:var(--color-text-info)">${tot}</div></div>`+
    `<div class="stat"><div class="stat-lbl">กำลังจะถึง</div><div class="stat-num" style="color:var(--color-text-warning)">${act}</div></div>`+
    `<div class="stat"><div class="stat-lbl">เร่งด่วน ≤7 วัน</div><div class="stat-num" style="color:var(--color-text-danger)">${hot}</div></div>`+
    `<div class="stat"><div class="stat-lbl">ได้รับรางวัล</div><div class="stat-num" style="color:var(--color-text-success)">${won}</div></div>`;

  const el=document.getElementById('cards');
  if(!items.length){el.innerHTML=`<div class="empty"><i class="ti ti-trophy-off" aria-hidden="true"></i>${tot?'ไม่พบรายการที่ตรงกัน':'ยังไม่มีรายการ กด "เพิ่มรายการ" เพื่อเริ่มต้น'}</div>`;return;}
  el.innerHTML=items.map(e=>{
    const u=urg(e),d=days(e.date),p=Math.min(100,Math.max(0,parseInt(e.progress)||0));
    return`<div class="ccard ${u}">
  <div class="crow"><div class="ctitle">${e.name}</div>
    <div class="pills">${e.result?`<span class="pill ${RC[e.result]}">${RL[e.result]}</span>`:''}<span class="pill ${UC[u]}">${urgLabel(u,d)}</span></div>
  </div>
  <div class="cmeta">
    <span><i class="ti ti-calendar" style="font-size:13px" aria-hidden="true"></i><b>${fmt(e.date)}</b></span>
    <span><i class="ti ti-map-pin" style="font-size:13px" aria-hidden="true"></i>${e.level||'—'}</span>
    <span><i class="ti ti-users" style="font-size:13px" aria-hidden="true"></i><span style="overflow:hidden;text-overflow:ellipsis">${e.members||'—'}</span></span>
    <span><i class="ti ti-user-check" style="font-size:13px" aria-hidden="true"></i>${e.teacher||'—'}</span>
  </div>
  ${e.note?`<div class="cnote"><i class="ti ti-notes" style="font-size:12px;margin-right:3px" aria-hidden="true"></i>${e.note}</div>`:''}
  <div class="prow"><div class="pbar"><div class="pfill pfill-${u}" style="width:${p}%"></div></div><span class="pct">${p}%</span></div>
  <div class="cbtns">
    <button onclick="openEdit('${e.id}')" style="font-size:12px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px"><i class="ti ti-edit" aria-hidden="true"></i>แก้ไข</button>
    <button onclick="del('${e.id}')" style="font-size:12px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;color:var(--color-text-danger);border-color:var(--color-border-danger)"><i class="ti ti-trash" aria-hidden="true"></i>ลบ</button>
  </div>
</div>`;
  }).join('');
}

function openAdd(){
  eid=null;
  document.getElementById('mh').innerHTML='<i class="ti ti-plus" aria-hidden="true"></i>เพิ่มรายการแข่งขัน';
  ['fn','fm','ft','fno'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fd').value='';
  document.getElementById('flv').selectedIndex=0;
  document.getElementById('frs').value='';
  document.getElementById('fp').value='0';
  document.getElementById('ov').classList.add('open');
  document.getElementById('ov').scrollIntoView({behavior:'smooth',block:'start'});
}

function openEdit(id){
  const e=db.find(x=>x.id===id);if(!e)return;
  eid=id;
  document.getElementById('mh').innerHTML='<i class="ti ti-edit" aria-hidden="true"></i>แก้ไขรายการ';
  document.getElementById('fn').value=e.name||'';
  document.getElementById('fd').value=e.date||'';
  document.getElementById('flv').value=e.level||'ระดับโรงเรียน';
  document.getElementById('fm').value=e.members||'';
  document.getElementById('ft').value=e.teacher||'';
  document.getElementById('frs').value=e.result||'';
  document.getElementById('fp').value=e.progress||0;
  document.getElementById('fno').value=e.note||'';
  document.getElementById('ov').classList.add('open');
  document.getElementById('ov').scrollIntoView({behavior:'smooth',block:'start'});
}

function closeModal(){document.getElementById('ov').classList.remove('open');}

function save(){
  const name=document.getElementById('fn').value.trim(),date=document.getElementById('fd').value;
  if(!name||!date){alert('กรุณากรอกชื่อรายการและวันที่');return;}
  const entry={
    id:eid||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    name,date,
    level:document.getElementById('flv').value,
    members:document.getElementById('fm').value.trim(),
    teacher:document.getElementById('ft').value.trim(),
    result:document.getElementById('frs').value,
    progress:parseInt(document.getElementById('fp').value)||0,
    note:document.getElementById('fno').value.trim(),
  };
  if(eid){const i=db.findIndex(x=>x.id===eid);if(i>=0)db[i]=entry;}else db.push(entry);
  persist();closeModal();render();
}

function del(id){if(!confirm('ลบรายการนี้?'))return;db=db.filter(x=>x.id!==id);persist();render();}

function doExport(){
  if(!db.length){alert('ไม่มีข้อมูล');return;}
  const h=['ชื่อรายการ','วันที่','ระดับ','ผู้เข้าร่วม','ครูที่ปรึกษา','ผลการแข่งขัน','ความคืบหน้า%','หมายเหตุ'];
  const rows=db.map(e=>[e.name,e.date,e.level,e.members,e.teacher,RL[e.result]||'',e.progress||0,e.note||''].map(v=>`"${(v+'').replace(/"/g,'""')}"`).join(','));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent([h.join(','),...rows].join('\n'));
  a.download='competitions.csv';a.click();
}

if(!db.length){
  const add=d=>{const t=new Date();t.setDate(t.getDate()+d);return t.toISOString().slice(0,10);};
  db=[
    {id:'d1',name:'การแข่งขันหุ่นยนต์ สพฐ. ระดับชาติ',date:add(5),level:'ระดับชาติ',members:'สมชาย ใจดี, วิมล สุขใส',teacher:'ครูวิไล มีสุข',result:'',progress:80,note:'เตรียมหุ่นยนต์เสร็จแล้ว รอทดสอบรอบสุดท้าย'},
    {id:'d2',name:'สิ่งประดิษฐ์คนรุ่นใหม่ ปี 2568',date:add(22),level:'ระดับจังหวัด',members:'ปิ่น แสงทอง, นาย ก้อง',teacher:'ครูสุชาติ ดีงาม',result:'',progress:45,note:'อยู่ระหว่างจัดทำรายงาน'},
    {id:'d3',name:'โครงงานวิทยาศาสตร์ระดับภาค',date:add(58),level:'ระดับภาค',members:'ดาว เจริญ',teacher:'ครูพิมพ์ใจ ใจกว้าง',result:'',progress:20,note:''},
    {id:'d4',name:'แข่งขันโปรแกรมมิ่ง ACM-ICPC',date:add(-10),level:'นานาชาติ',members:'ปัญญา สว่าง, กมล ยิ้มแย้ม',teacher:'ครูเทพ นิยมดี',result:'silver',progress:100,note:'ได้รับรางวัลรองชนะเลิศ เยี่ยมมาก!'},
  ];
  persist();
}
render();
</script>
